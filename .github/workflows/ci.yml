name: CI Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint Check
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Test (Next.js)
        run: npm run build

      - name: Packaging Test (Electron Dry-Run)
        run: npx electron-builder --linux --dir
        env:
          GH_TOKEN: dummy_token_for_ci
