appId: com.2edge.modscan-pro
productName: ModScan Pro
copyright: Copyright © 2026 2edge.co

directories:
  output: dist
  buildResources: build

files:
  - electron/**/*
  - out/**/*
  - package.json
  - "!**/node_modules"
  - "!src"
  - "!bin"
  - "!dist"
  - "!scripts"
  - "!.next"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/*.md"

asar: true
asarUnpack:
  - "**/node_modules/serialport/**/*"
  - "**/node_modules/@serialport/**/*"
  - "**/node_modules/modbus-serial/**/*"

publish:
  provider: github
  owner: ThanabordeeN
  repo: ModScan-Pro

mac:
  category: public.app-category.utilities
  target:
    - dmg
  icon: public/icon.icns
  extraResources:
    - from: bin/cloudflared-darwin-amd64
      to: bin/cloudflared-darwin-amd64
    - from: bin/cloudflared-darwin-arm64
      to: bin/cloudflared-darwin-arm64

win:
  target:
    - nsis
    - portable
  icon: public/icon.ico
  extraResources:
    - from: bin/cloudflared.exe
      to: bin/cloudflared.exe

linux:
  target:
    - AppImage
  category: Utility
  icon: public/icon.png
  extraResources:
    - from: bin/cloudflared-linux-amd64
      to: bin/cloudflared-linux-amd64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
