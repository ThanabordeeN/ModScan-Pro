name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Download cloudflared (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          curl -L -o bin/cloudflared-linux-amd64 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x bin/cloudflared-linux-amd64

      - name: Download cloudflared (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          curl -L -o bin/cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Download cloudflared (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          curl -L -o /tmp/cloudflared-darwin-amd64.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz
          tar -xzf /tmp/cloudflared-darwin-amd64.tgz -C bin/
          mv bin/cloudflared bin/cloudflared-darwin-amd64
          chmod +x bin/cloudflared-darwin-amd64
          curl -L -o /tmp/cloudflared-darwin-arm64.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared-darwin-arm64.tgz -C bin/
          mv bin/cloudflared bin/cloudflared-darwin-arm64
          chmod +x bin/cloudflared-darwin-arm64

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Build Electron App
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --publish always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --linux --publish always
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
